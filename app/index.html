<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kế hoạch du lịch</title>
  <meta name="theme-color" content="#1F3A5F">
  <script data-che-do>
    /* Áp chế độ sáng/tối TRƯỚC khi trang hiện — khỏi chớp nền sáng khi đang
       chọn tối. Lặp lại khoá lưu và luật chọn của src/lib/che-do.js; đổi bên
       kia thì đổi cả ở đây (che-do.test.js chạy thật đoạn này để canh). */
    (function () {
      var c = 'theo-may'
      try { c = window.localStorage.getItem('ke-hoach-du-lich-che-do') || c } catch (e) {}
      var toi = c === 'toi'
      if (c !== 'toi' && c !== 'sang') {
        try { toi = window.matchMedia('(prefers-color-scheme: dark)').matches } catch (e) {}
      }
      document.documentElement.setAttribute('data-che-do', toi ? 'toi' : 'sang')
    })()
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    /* Người gác kho — đăng ký sau khi trang đã lên, không chặn lần mở đầu. */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {})
      })
    }
  </script>
</body>
</html>
